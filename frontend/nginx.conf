# Balanceador de carga de la API y servidor del frontend compilado.

# DNS interno de Docker: un nodo que se reinicia con otra IP vuelve a recibir tráfico.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream backend {
    zone backend 64k;
    server backend1:8080 max_fails=1 fail_timeout=10s resolve;
    server backend2:8080 max_fails=1 fail_timeout=10s resolve;
}

server {
    listen 80;
    server_tokens off;
    client_max_body_size 16k;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://backend;
        proxy_connect_timeout 1s;
        proxy_read_timeout 10s;
        # Un POST ya enviado a un nodo no se reintenta en el otro: evita pedidos duplicados.
        proxy_next_upstream error timeout;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}
